<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Student Management</title>
  <style>
    body { font-family: Arial; max-width: 700px; margin: 40px auto; }
    input, button { padding: 8px; margin: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <h1>Student Management</h1>
  <input id="name" placeholder="Name">
  <input id="course" placeholder="Course">
  <button onclick="addStudent()">Add</button>
  <table>
    <thead><tr><th>Name</th><th>Course</th><th>Action</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
  <script>
    let students = JSON.parse(localStorage.getItem("students") || "[]");

    function show() {
      document.getElementById("list").innerHTML = students.map((s, i) =>
        `<tr><td>${s.name}</td><td>${s.course}</td>
        <td><button onclick="removeStudent(${i})">Delete</button></td></tr>`
      ).join("");
    }

    function addStudent() {
      const name = document.getElementById("name").value.trim();
      const course = document.getElementById("course").value.trim();
      if (!name || !course) return alert("Enter name and course");
      students.push({ name, course });
      localStorage.setItem("students", JSON.stringify(students));
      document.getElementById("name").value = "";
      document.getElementById("course").value = "";
      show();
    }

    function removeStudent(index) {
      students.splice(index, 1);
      localStorage.setItem("students", JSON.stringify(students));
      show();
    }

    show();
  </script>
</body>
</html>
